name: CI Pipeline
# Reuse Workflow to be call from other workflows
on:
  workflow_call: 
    secrets:
      SONAR_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
      required: true
      
      

jobs:
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: | 
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-report
          path: reports/
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload the analysis results
    strategy:
      matrix: 
        language: ['python']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"
  sonarqube:
    name: SonarQube
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: unit-test-report
          path: reports/
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [codeql, sonarqube]
    if : success()
    outputs:
      image-tags: ${{steps.vars.outputs.IMAGE_TAGS}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate Image Tags
        id: vars
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
      - name: Build Image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: thinknyx_app:${{steps.vars.outputs.IMAGE_TAGS}}
          load: true
      - name: Save Docker Image
        run: docker save thinknyx_app:${{steps.vars.outputs.IMAGE_TAGS}} -o thinknyx_app.tar
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7
        with: 
          name: thinknyx_app_image
          path: thinknyx_app.tar
  publish-dockerhub:
    name: Publish To Docker Hub
    runs-on: ubuntu-latest
    needs: build       
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v8
        with:
          name: thinknyx_app_image
          path: .
      - name: Load Docker Image
        run: docker load -i thinknyx_app.tar
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image tag thinknyx_app:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/thinknyx_app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image push ${{ secrets.DOCKERHUB_USERNAME }}/thinknyx_app:$IMAGE_TAG
  publish-ghcr:
    name: Publish To Github Container Registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read   
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v8
        with:
          name: thinknyx_app_image
          path: .
      - name: Load Docker Image
        run: docker load -i thinknyx_app.tar
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}} # Github automaticcaly creates a GitHub_token secret to use in your workflow, with push to GHCR, create, release, add comments, creates issues as authorizations
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image tag thinknyx_app:$IMAGE_TAG ghcr.io/${{ github.repository_owner }}/thinknyx_app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
           docker image push ghcr.io/${{ github.repository_owner }}/thinknyx_app:$IMAGE_TAG
